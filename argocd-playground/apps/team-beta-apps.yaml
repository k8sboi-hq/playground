apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-beta-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: team-beta

  source:
    # TODO: Update with your repository URL
    repoURL: https://github.com/YOUR_ORG/argocd-playground.git
    targetRevision: HEAD
    path: manifests/team-beta
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: team-beta

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
